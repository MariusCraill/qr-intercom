<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intercom - Ring to Enter</title>
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <h1 id="header-title">Loading...</h1>
      <p id="header-subtitle" class="subtitle"></p>
    </header>

    <section id="directory-section">
      <div class="search-box">
        <input
          type="text"
          id="search-input"
          placeholder="Search by name or unit..."
          autocomplete="off"
        />
      </div>
      <ul id="resident-list" class="resident-list"></ul>
    </section>

    <section id="call-section" class="hidden">
      <div class="call-status">
        <div class="pulse-ring" id="pulse-ring"></div>
        <p id="call-status-text">Calling...</p>
      </div>
      <video id="local-video" autoplay muted playsinline></video>
      <video id="remote-video" autoplay playsinline></video>
      <audio id="remote-audio" autoplay></audio>
      <div class="call-controls">
        <button id="btn-toggle-speaker" class="btn btn-secondary">Speaker: On</button>
        <button id="btn-end-call" class="btn btn-danger">End Call</button>
      </div>
    </section>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
