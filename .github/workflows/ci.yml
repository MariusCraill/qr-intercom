name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks-action hardcodes --log-opts for push events (it scans only
      # the commits in the push, and v3 exposes no inputs to change that), so a
      # secret added in an older revision would never be re-examined. Driving the
      # CLI directly is what makes the full-history scan below possible.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # Keep the release filename: sha256sum --check resolves the path from the
          # checksums file, so a renamed download cannot be verified.
          curl -sSfL "${base}/${asset}" -o "${asset}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep " ${asset}\$" checksums.txt | sha256sum --check --strict
          tar -xzf "${asset}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan every commit
        run: |
          gitleaks detect \
            --redact \
            --verbose \
            --exit-code 1 \
            --log-opts "--all --full-history"

  syntax:
    name: Syntax check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Every source file must parse
        run: |
          find server agent-app -name node_modules -prune -o -name '*.js' -print0 \
            | xargs -0 -n1 node --check

  install:
    name: Install (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [server, agent-app]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      # npm ci fails if a lockfile has drifted out of sync with its package.json.
      - name: npm ci
        run: npm ci
        working-directory: ${{ matrix.project }}

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The distro SDK packages avoid sdkmanager and the Gradle/AGP download chain.
      - name: Install Android build tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            android-sdk android-sdk-platform-23 dalvik-exchange
      - name: Build
        run: android/build.sh
