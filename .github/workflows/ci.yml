name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Free for public repos. Stops a .env, key or token from ever landing in history.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  syntax:
    name: Syntax check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Every source file must parse
        run: |
          find server agent-app -name node_modules -prune -o -name '*.js' -print0 \
            | xargs -0 -n1 node --check

  install:
    name: Install (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [server, agent-app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      # npm ci fails if a lockfile has drifted out of sync with its package.json.
      - name: npm ci
        working-directory: ${{ matrix.project }}
