<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>QR Intercom - Gate</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .gate-container {
      max-width: 480px;
      width: 100%;
      padding: 24px;
    }
    .gate-icon {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 48px;
      border: 3px solid var(--border);
    }
    .gate-name {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .gate-location {
      color: var(--text-dim);
      margin-bottom: 32px;
    }
    .call-btn {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: var(--success);
      color: white;
      border: none;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 0 auto;
      box-shadow: 0 8px 32px rgba(22, 163, 74, 0.3);
    }
    .call-btn:hover { transform: scale(1.05); background: var(--success-dark); }
    .call-btn:active { transform: scale(0.98); }
    .call-btn.ringing {
      background: var(--danger);
      animation: pulse 1.5s infinite;
    }
    .call-btn.in-call {
      background: var(--danger);
      box-shadow: 0 8px 32px rgba(220, 38, 38, 0.3);
    }
    .call-btn .icon { font-size: 48px; }
    .status-text {
      margin-top: 24px;
      color: var(--text-dim);
      font-size: 0.9rem;
    }
    .visitor-id {
      margin-top: 40px;
      padding: 12px;
      background: var(--bg-card);
      border-radius: 8px;
      color: var(--text-dim);
      font-size: 0.8rem;
    }
    .video-container {
      position: fixed;
      inset: 0;
      background: black;
      z-index: 100;
      display: none;
    }
    .video-container.active { display: flex; align-items: center; justify-content: center; }
    .video-container video {
      max-width: 100%;
      max-height: 100%;
    }
    .video-overlay {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 101;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4); }
      50% { box-shadow: 0 0 0 20px rgba(220, 38, 38, 0); }
    }
  </style>
</head>
<body>
  <div class="gate-container">
    <div class="gate-icon">🚪</div>
    <div class="gate-name" id="gate-name">Loading...</div>
    <div class="gate-location" id="gate-location"></div>

    <button class="call-btn" id="call-btn" onclick="toggleCall()">
      <span class="icon">📞</span>
      <span id="call-btn-text">Ring Bell</span>
    </button>

    <div class="status-text" id="status-text">Ready</div>
    <div class="visitor-id" id="visitor-id"></div>
  </div>

  <div class="video-container" id="video-container">
    <video id="remote-video" autoplay playsinline></video>
    <div class="video-overlay">
      <button class="btn btn-danger" onclick="endCall()" style="font-size:1.1rem;padding:14px 32px">End Call</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const gateId = window.location.pathname.split('/').pop();
    const visitorId = 'visitor-' + Math.random().toString(36).substr(2, 8);
    const socket = io();
    let callId = null;
    let localStream = null;
    let remoteStream = null;
    let peerConnection = null;

    const ICE_SERVERS = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    document.getElementById('visitor-id').textContent = `Visitor: ${visitorId}`;

    async function loadGate() {
      try {
        const res = await fetch(`/api/public/gates/${encodeURIComponent(gateId)}`);
        if (res.ok) {
          const gate = await res.json();
          document.getElementById('gate-name').textContent = gate.name;
          document.getElementById('gate-location').textContent = gate.location || '';
        } else {
          document.getElementById('gate-name').textContent = 'Gate ' + gateId;
        }
      } catch {
        document.getElementById('gate-name').textContent = 'Gate ' + gateId;
      }
    }

    async function toggleCall() {
      if (callId) {
        endCall();
      } else {
        startCall();
      }
    }

    async function startCall() {
      const btn = document.getElementById('call-btn');
      btn.classList.add('ringing');
      document.getElementById('call-btn-text').textContent = 'Calling...';
      document.getElementById('status-text').textContent = 'Connecting to resident...';

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      } catch (e) {
        document.getElementById('status-text').textContent = 'Camera/mic access denied';
        btn.classList.remove('ringing');
        document.getElementById('call-btn-text').textContent = 'Ring Bell';
        return;
      }

      socket.emit('call:request', { gateId, visitorId });
    }

    socket.on('call:incoming', (data) => {
      if (data.gateId === gateId && !callId) {
        callId = data.callId;
      }
    });

    socket.on('call:answered', async (data) => {
      if (data.callId === callId) {
        const btn = document.getElementById('call-btn');
        btn.classList.remove('ringing');
        btn.classList.add('in-call');
        document.getElementById('call-btn-text').textContent = 'End Call';
        document.getElementById('status-text').textContent = 'Connected!';

        peerConnection = new RTCPeerConnection(ICE_SERVERS);
        localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));

        peerConnection.ontrack = (e) => {
          document.getElementById('remote-video').srcObject = e.streams[0];
          document.getElementById('video-container').classList.add('active');
        };

        peerConnection.onicecandidate = (e) => {
          if (e.candidate) socket.emit('webrtc:ice-candidate', { callId, candidate: e.candidate });
        };

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        socket.emit('webrtc:offer', { callId, offer });
      }
    });

    socket.on('webrtc:answer', async (data) => {
      if (data.callId === callId && peerConnection) {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
      }
    });

    socket.on('webrtc:ice-candidate', (data) => {
      if (data.callId === callId && peerConnection) {
        peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
      }
    });

    socket.on('call:ended', (data) => {
      if (data.callId === callId) {
        resetUI();
      }
    });

    socket.on('gate:unlocked', (data) => {
      if (data.callId === callId) {
        document.getElementById('status-text').textContent = 'Gate unlocked!';
        setTimeout(() => {
          document.getElementById('status-text').textContent = 'Connected!';
        }, 3000);
      }
    });

    function endCall() {
      if (callId) {
        socket.emit('call:end', { callId });
      }
      resetUI();
    }

    function resetUI() {
      callId = null;
      if (peerConnection) { peerConnection.close(); peerConnection = null; }
      if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }

      document.getElementById('video-container').classList.remove('active');
      const btn = document.getElementById('call-btn');
      btn.classList.remove('ringing', 'in-call');
      document.getElementById('call-btn-text').textContent = 'Ring Bell';
      document.getElementById('status-text').textContent = 'Ready';
    }

    loadGate();
  </script>
</body>
</html>
