<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>QR Intercom - Gate</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .gate-container {
      max-width: 480px;
      width: 100%;
      padding: 24px;
    }
    .gate-icon {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 48px;
      border: 3px solid var(--border);
    }
    .gate-name {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .gate-location {
      color: var(--text-dim);
      margin-bottom: 32px;
    }
    .call-btn {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: var(--success);
      color: white;
      border: none;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 0 auto;
      box-shadow: 0 8px 32px rgba(22, 163, 74, 0.3);
    }
    .call-btn:hover { transform: scale(1.05); background: var(--success-dark); }
    .call-btn:active { transform: scale(0.98); }
    .call-btn.ringing {
      background: var(--danger);
      animation: pulse 1.5s infinite;
    }
    .call-btn.in-call {
      background: var(--danger);
      box-shadow: 0 8px 32px rgba(220, 38, 38, 0.3);
    }
    .call-btn .icon { font-size: 48px; }
    .status-text {
      margin-top: 24px;
      color: var(--text-dim);
      font-size: 0.9rem;
    }
    .visitor-id {
      margin-top: 40px;
      padding: 12px;
      background: var(--bg-card);
      border-radius: 8px;
      color: var(--text-dim);
      font-size: 0.8rem;
    }
    .video-container {
      position: fixed;
      inset: 0;
      background: black;
      z-index: 100;
      display: none;
    }
    .video-container.active { display: flex; align-items: center; justify-content: center; }
    .video-container video {
      max-width: 100%;
      max-height: 100%;
    }
    .video-overlay {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 101;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4); }
      50% { box-shadow: 0 0 0 20px rgba(220, 38, 38, 0); }
    }
  </style>
</head>
<body>
  <div class="gate-container">
    <div class="gate-icon">🚪</div>
    <div class="gate-name" id="gate-name">Loading...</div>
    <div class="gate-location" id="gate-location"></div>

    <button class="call-btn" id="call-btn" onclick="visitorCall.toggle()">
      <span class="icon">📞</span>
      <span id="call-btn-text">Ring Bell</span>
    </button>

    <div class="status-text" id="status-text">Ready</div>
    <div class="visitor-id" id="visitor-id"></div>
  </div>

  <div class="video-container" id="video-container">
    <video id="remote-video" autoplay playsinline></video>
    <div class="video-overlay">
      <button class="btn btn-danger" onclick="visitorCall.end()" style="font-size:1.1rem;padding:14px 32px">End Call</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/visitor-call.js"></script>
  <script>
    const gateId = window.location.pathname.split('/').pop();

    const visitorCall = createVisitorCall({
      requestEvent: 'call:request',
      request: () => ({ gateId }),
      idleLabel: 'Ring Bell',
      idleStatus: 'Ready'
    });

    async function loadGate() {
      try {
        const res = await fetch(`/api/public/gates/${encodeURIComponent(gateId)}`);
        if (res.ok) {
          const gate = await res.json();
          document.getElementById('gate-name').textContent = gate.name;
          document.getElementById('gate-location').textContent = gate.location || '';
        } else {
          document.getElementById('gate-name').textContent = 'Gate ' + gateId;
        }
      } catch {
        document.getElementById('gate-name').textContent = 'Gate ' + gateId;
      }
    }

    loadGate();
  </script>
</body>
</html>
